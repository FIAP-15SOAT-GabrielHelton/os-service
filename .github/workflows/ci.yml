name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_extra:
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: trivy
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,misconfig
        continue-on-error: true

      - name: Check Trivy results and output warning
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            MISCONFIG_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            TOTAL=$((VULN_COUNT + MISCONFIG_COUNT))

            if [ "$TOTAL" -gt 0 ]; then
              echo "::error::Trivy found $VULN_COUNT HIGH/CRITICAL vulnerabilities and $MISCONFIG_COUNT HIGH/CRITICAL misconfigurations"
              exit 1
            fi
          fi

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/ruby
            p/security-audit
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_mecanica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      RAILS_ENV: test
      COVERAGE: "1"
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bundle exec rspec

      # Análise estática + cobertura no SonarQube Cloud. O quality gate reprovado falha o job.
      # Sem o secret (ex.: PR do Dependabot), a etapa é pulada.
      - name: SonarQube scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1 (fixado por SHA, exigência do próprio Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=fiap-15soat-gabrielhelton
            -Dsonar.projectKey=FIAP-15SOAT-GabrielHelton_os-service
            -Dsonar.qualitygate.wait=true

      - name: Write coverage to job summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            line=$(jq -r '.result.line' coverage/.last_run.json)
            branch=$(jq -r '.result.branch' coverage/.last_run.json)
            {
              echo "## Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              echo "| Line | ${line}% |"
              echo "| Branch | ${branch}% |"
              echo ""
              echo "Threshold: 80% line / 80% branch (enforced by SimpleCov)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
