sonar.projectKey=oficina_mecanica
sonar.projectName=Oficina Mecanica API
sonar.projectVersion=1.0

sonar.sources=app
sonar.tests=spec

# No SonarQube Cloud o projeto inteiro é analisado e sonar.sources/sonar.tests são ignorados.
# Estas duas linhas dizem o que é teste e o que não entra na conta de cobertura:
# a cobertura mede só o código da aplicação (app/).
sonar.test.inclusions=spec/**
sonar.coverage.exclusions=spec/**,config/**,db/**,bin/**,lib/**

sonar.exclusions=\
  app/assets/**,\
  app/views/**,\
  vendor/**,\
  db/schema.rb,\
  db/migrate/**,\
  public/**,\
  node_modules/**,\
  log/**,\
  tmp/**,\
  storage/**,\
  coverage/**

sonar.test.exclusions=\
  spec/swagger_helper.rb,\
  spec/support/**

sonar.language=ruby
sonar.sourceEncoding=UTF-8

sonar.ruby.coverage.reportPaths=coverage/coverage.json

sonar.host.url=http://sonarqube:9000

# Apontamentos avaliados e aceitos, com o motivo:
sonar.issue.ignore.multicriteria=routes,devcopy,lbhttp
# Rotas no estilo idiomático do Rails (`patch :assign` dentro de `member`); a API não tem página inicial.
sonar.issue.ignore.multicriteria.routes.ruleKey=rubydre:S7875
sonar.issue.ignore.multicriteria.routes.resourceKey=config/routes.rb
# Imagem só de desenvolvimento; `.dockerignore` já exclui .env, chaves e .git do `COPY . .`.
sonar.issue.ignore.multicriteria.devcopy.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.devcopy.resourceKey=Dockerfile.dev
# O Load Balancer do ambiente AWS Academy não tem certificado; a URL publicada no SSM é http.
sonar.issue.ignore.multicriteria.lbhttp.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.lbhttp.resourceKey=.github/workflows/cd_deploy.yml
