apiVersion: batch/v1
kind: Job
metadata:
  name: os-service-db-prepare
  namespace: default
spec:
  template:
    metadata:
      name: os-service-db-prepare
    spec:
      # O pod não fala com a API do Kubernetes; sem token da service account montado.
      automountServiceAccountToken: false
      containers:
        - name: db-prepare
          image: IMAGE_PLACEHOLDER
          command: ["bin/rails", "db:prepare"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Toda a configuração vem do ConfigMap e do Secret deste serviço (o Secret é criado pelo cd_deploy.yml).
          envFrom:
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secrets
      restartPolicy: OnFailure
  backoffLimit: 3
