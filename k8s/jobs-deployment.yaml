apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service-jobs
  namespace: default
  labels:
    app: os-service-jobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-service-jobs
  template:
    metadata:
      labels:
        app: os-service-jobs
    spec:
      # O pod não fala com a API do Kubernetes; sem token da service account montado.
      automountServiceAccountToken: false
      containers:
        - name: jobs
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command: ["bin/jobs"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Toda a configuração vem do ConfigMap e do Secret deste serviço (o Secret é criado pelo cd_deploy.yml).
          envFrom:
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secrets
